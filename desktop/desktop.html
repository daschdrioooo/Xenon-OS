<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>xenonOS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="desktop.css">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    </head>
    <body>
        <nav class="menubar">
            <div class="menubar-left">
                <button class="menu-btn">
                    <i data-lucide="circle"></i>
                </button>
                <button class="app-name">Manager</button>
                <button class="menu-label">Menu1</button>
                <button class="menu-label">Menu2</button>
            </div>
            <div class="menubar-right">
                <button class="right-btn"><i data-lucide="search"></i></button>
                <button><i data-lucide="sliders-horizontal"></i></button>
                <button class="clock" id="clock"></button>
            </div>
        </nav>
        <script src="desktop.js"></script>
    </body>
</html>
