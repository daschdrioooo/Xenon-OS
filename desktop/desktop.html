<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>XenonOS - Desktop</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="desktop.css">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    </head>
    <body>
        <nav class="menubar">
            <div class="menubar-left" id="menubarLeft">
                <!--populated by js-->
            </div>
            <div class="menubar-right">
                <button class="right-btn" id="appsBtn"><i data-lucide="layout-grid"></i></button>
                <button id="ccBtn"><i data-lucide="sliders-horizontal"></i></button>
                <button class="clock" id="clock"></button>
            </div>
        </nav>
        <div class="widgets" id="widgets"></div>
        <div class="window-layer" id="windowLayer"></div>
        <nav class="dock" id="dock"></nav>
        <div class="app-library" id="appLibrary" role="dialog">
            <div class="app-search">
                <i data-lucide="search"></i>
                <input id="appSearch" type="text" placeholder="App Library" autocomplete="off" spellcheck="false">
            </div>
            <div class="app-sep"></div>
            <div class="app-list" id="appList"></div>
        </div>
        <div id="brightness"></div>
        <div id="controlCentre" role="dialog">
            <div>
                <div class="cc-label">
                    <i data-lucide="sun"></i>
                    <span>Brightness</span>
                    <span class="cc-value" id="ccBrightnessValue"></span>
                </div>
                <div class="cc-slider">
                    <input id="ccBrightness" type="range" min="25" max="100" step="1">
                </div>
            </div>
            <div>
                <div class="cc-label">
                    <span id="ccVolIcon"><i data-lucide="volume-2"></i></span>
                    <span>Volume</span>
                    <span class="cc-value" id="ccVolumeValue"></span>
                </div>
                <div class="cc-slider">
                    <input id="ccVolume" type="range" min="0" max="100" step="1">
                </div>
            </div>
        </div>
        <div class="dropdown" id="dropdown" role="menu"></div>
        <script src="desktop.js"></script>
    </body>
</html>
