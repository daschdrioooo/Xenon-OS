<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>XenonOS - Setup</title>
        <link rel="stylesheet" href="setup.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <meta name="google" content="notranslate">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    </head>

    <body>
        <svg width="0" height="0" style="position:absolute">
            <filter id="glass" x="0" y="0" width="100%" height="100%">
             <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="3" result="noise"/>
             <feGaussianBlur in="noise" stdDeviation="2" result="map"/>
             <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </svg>
        <div id="setupCard">
            <button id="back"><i id="backIcon" data-lucide="chevron-left"></i></button>
            <div id="earthIcon"><i id="earth" data-lucide="earth"></i></div>
            <h1 style="color: white; margin-left: 100px; margin-top: -40px; font-size: 20px;">Title</h1>
            <p style="color: white; margin-left: 100px;">Subtext</p>
            <button id="continueBtn">Continue</button>
        </div>
        <script src="setup.js"></script>
    </body>
</html>
