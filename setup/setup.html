<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>XenonOS - Setup</title>
        <link rel="stylesheet" href="setup.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <meta name="google" content="notranslate">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    </head>

    <body>
        <div id="setupCard">
            <button id="back">&#8249;</button>
            <div id="earthIcon"><i id="earth" data-lucide="earth"></i></div>
            <h1 style="font-size: 20px; color: white; margin-left: 15%; padding-bottom: 16px;">Please select your timezone</h1>
            <ul class="optionList" style="color: white; margin-left: 15%; list-style: none; height: 120px; overflow-y: auto; border: 1px solid white; margin-bottom: 40px; padding: 20px; margin-right: 75px;">
                <li></li>
            </ul>
            <button id="continueBtn">Continue</button>
        </div>
        <script src="setup.js"></script>
    </body>
</html>
